name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Lint (zero errors)
        run: npm run lint

      - name: Build (production, TypeScript included)
        run: npm run build
